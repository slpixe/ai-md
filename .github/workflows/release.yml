name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version-type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  prepare:
    name: prepare release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release candidate
        run: pnpm validate

      - name: Create version commit
        env:
          VERSION_TYPE: ${{ inputs.version-type }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm version "$VERSION_TYPE" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          BRANCH="release/v${VERSION}"
          git switch --create "$BRANCH"
          git add package.json pnpm-lock.yaml jsr.json src/version.ts
          git commit -m "chore(release): v${VERSION}"
          git push --set-upstream origin "$BRANCH"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Open release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "release/v${VERSION}" \
            --title "chore(release): v${VERSION}" \
            --body "Automated version update for v${VERSION}. Merge after all required checks pass; publishing starts from the protected release environment."
